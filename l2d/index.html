@media (orientation:portrait){#right{width:100%;top:auto;height:auto;border-radius:18px 18px 0 0;padding:12px}.user{display:none}#side{bottom:auto;height:auto;flex-direction:row;right:10px;width:auto;padding:6px 10px}#side .sp{display:none}#panel{left:10px;right:10px;width:auto;top:80px;bottom:auto;max-height:60vh}#empty{transform:translate(-50%,-50%)}}

<script>
const $=s=>document.querySelector(s);
const S=Object.assign({scale:1,follow:true,dim:0,cur:null,auto:true},JSON.parse(localStorage.getItem('l2d_set')||'{}'));
const save=()=>localStorage.setItem('l2d_set',JSON.stringify(S));
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms||2200)}
// ---------- 给作者点赞 ----------
let likeBusy=0;async function likeAuthor(){if(likeBusy)return;likeBusy=1;toast('正在给作者点赞…');try{const r=await fetch('https://47-76-159-111.sslip.io/pub/like',{method:'POST'});const d=await r.json();toast(d.ok?`👍 已给作者京阿尼唯点赞 ${d.sent} 下，谢谢支持！`:(d.n>=10?'作者今天的赞已经满啦，明天再来～谢谢你':(d.msg||'没赞上，晚点再试')),3000)}catch(e){toast('网络不太好，晚点再试')}likeBusy=0}
// ---------- IndexedDB 本地模型库 ----------
let DB;const idb=()=>DB||(DB=new Promise((ok,no)=>{const r=indexedDB.open('l2d',1);r.onupgradeneeded=()=>{r.result.createObjectStore('models',{keyPath:'id'});r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
async function tx(store,mode,fn){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction(store,mode),s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
const listModels=()=>tx('models','readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>y.added-x.added));
const getModel=id=>tx('models','readonly',s=>s.get(id));
const putModel=o=>tx('models','readwrite',s=>s.put(o));
const delModel=id=>tx('models','readwrite',s=>s.delete(id));
// ---------- Live2D ----------
const ZL=PIXI.live2d.ZipLoader;
ZL.zipReader=(data)=>JSZip.loadAsync(data);
ZL.readText=(z,p)=>{const f=z.file(p);if(!f)throw new Error('缺少 '+p);return f.async('text')};
ZL.getFilePaths=z=>{const a=[];z.forEach(p=>a.push(p));return Promise.resolve(a)};
ZL.getFiles=(z,paths)=>Promise.all(paths.map(async p=>{const b=await z.file(p).async('blob');return new File([b],p.slice(p.lastIndexOf('/')+1))}));
PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
const app=new PIXI.Application({resizeTo:window,backgroundAlpha:0,antialias:true,autoStart:true,resolution:Math.min(devicePixelRatio||1,2),autoDensity:true});
$('#stage').appendChild(app.view);
let m=null,core=null,curMeta=null,t0=performance.now(),fx=0,fy=0,tx_=0,ty_=0,lastTouch=0;
function fit(){if(!m)return;const W=innerWidth,H=innerHeight,port=H>W,avail=port?W:W-Math.min(W*.3,330)-80;
 const s=Math.min(H*(port?.78:.95)/m._H0,avail*.95/m._W0)*S.scale;m.scale.set(s);m.anchor.set(.5,.5);m.x=port?W/2:80+avail/2;m.y=port?H*.42:H*.52}
addEventListener('resize',fit);
async function show(src,meta){
 toast('正在加载模型…',8000);
 try{const nm=await PIXI.live2d.Live2DModel.from(src,{autoHitTest:false,autoFocus:false});
  if(m){app.stage.removeChild(m);m.destroy()}m=nm;app.stage.addChild(m);try{m.internalModel.renderer.setClippingMaskBufferSize(2048)}catch(e){}
  m.scale.set(1);m._W0=m.width;m._H0=m.height;fit();core=m.internalModel.coreModel;curMeta=meta;
  const mm=m.internalModel.motionManager,defs=mm.definitions||{};const idle=Object.keys(defs).find(k=>/idle/i.test(k));
  if(idle)m.motion(idle,0,1).catch(()=>{});
  m.internalModel.on('beforeModelUpdate',onUpd);$('#empty').style.display='none';$('#curName').textContent=meta.name;$('#goT').textContent='重新启动';toast('「'+meta.name+'」已启动')
 }catch(e){console.error(e);toast('加载失败：'+(e.message||e),4000)}}
function onUpd(){if(!core)return;const t=(performance.now()-t0)/1000,now=performance.now();const set=(id,v)=>{try{core.addParameterValueById(id,v)}catch(_){}};
 const follow=S.follow&&now-lastTouch<4000,gx=follow?tx_:0,gy=follow?ty_:0;fx+=(gx-fx)*.08;fy+=(gy-fy)*.08;
 if(follow||Math.abs(fx)>.01){set('ParamAngleX',fx*24);set('ParamAngleY',fy*18);set('ParamEyeBallX',fx*.8);set('ParamEyeBallY',fy*.8);set('ParamBodyAngleX',fx*6)}
 if(S.auto){set('ParamAngleZ',Math.sin(t*.6)*3);set('ParamBodyAngleZ',Math.sin(t*.6+.5)*2)}}
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{if($('#panel').classList.contains('on')){openP('home');return}tx_=(e.clientX/innerWidth)*2-1;ty_=-((e.clientY/innerHeight)*2-1);lastTouch=performance.now();
 if(m){const b=m.getBounds();if(e.clientX>b.x&&e.clientX<b.x+b.width&&e.clientY>b.y&&e.clientY<b.y+b.height){const hits=m.internalModel.hitTest?m.internalModel.hitTest(e.clientX,e.clientY):[];
  const defs=m.internalModel.motionManager.definitions||{},groups=Object.keys(defs).filter(k=>!/idle/i.test(k));
  const tap=groups.find(g=>hits.some(h=>g.toLowerCase().includes(String(h).toLowerCase())))||groups.find(g=>/tap/i.test(g))||groups[Math.floor(Math.random()*groups.length)];
  if(tap)m.motion(tap,undefined,3).catch(()=>{});else randExp()}}});
stage.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){tx_=(e.clientX/innerWidth)*2-1;ty_=-((e.clientY/innerHeight)*2-1);lastTouch=performance.now()}});
function exps(){if(!m)return[];const em=m.internalModel.motionManager.expressionManager;return em?(em.definitions||[]).map((d,i)=>d.Name||d.name||('表情'+(i+1))):[]}
function randExp(){const e=exps();if(e.length)m.expression(Math.floor(Math.random()*e.length))}
// ---------- 导入 ----------
const decName=b=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(_){try{return new TextDecoder('gbk').decode(b)}catch(__){return String.fromCharCode(...b)}}};
$('#fz').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast('正在检查压缩包…',8000);
 try{const z=await JSZip.loadAsync(f,{decodeFileName:decName});const js=[];z.forEach((p,o)=>{if(!o.dir&&(/\.model3\.json$/i.test(p)||/(^|\/)model\.json$/i.test(p))&&!/__MACOSX/.test(p))js.push(p)});
  if(!js.length)throw new Error('压缩包里没有 .model3.json');
  js.sort((a,b)=>a.split('/').length-b.split('/').length);const mj=js[0],dir=mj.includes('/')?mj.slice(0,mj.lastIndexOf('/')+1):'';
  const out=new JSZip();const tasks=[];z.forEach((p,o)=>{if(o.dir||!p.startsWith(dir)||/__MACOSX/.test(p)||/\.(cmo3|can3|psd)$/i.test(p))return;tasks.push(o.async('uint8array').then(d=>out.file(p.slice(dir.length),d)))});
  await Promise.all(tasks);const blob=await out.generateAsync({type:'blob',compression:'STORE'});
  let name=mj.split('/').pop().replace(/\.model3?\.json$/i,'');if(/^(seethrough_output|model)$/i.test(name))name=(dir.replace(/\/$/,'').split('/').pop())||f.name.replace(/\.zip$/i,'');
  const id='m'+Date.now();await putModel({id,name,file:'model.zip',size:blob.size,blob,added:Date.now(),kind:'zip'});
  S.cur=id;save();toast('导入成功：'+name);renderLib();launch()}catch(err){console.error(err);toast('导入失败：'+(err.message||err),4000)}};

const CDNS=['https://fastly.jsdelivr.net/gh/','https://cdn.jsdelivr.net/gh/','https://gcore.jsdelivr.net/gh/'];
const OFF='Live2D/CubismWebSamples@develop/Samples/Resources/';
const OL_OFF=[['Hiyori','日和','校服女孩，动作最全',''],['Haru','春','长发少女，表情丰富',''],['Mao','真绯','魔法少女，会挥魔杖',''],['Natori','名取','西装少年',''],['Rice','莱斯','小魔女',''],['Ren','莲','短发女孩',''],['Mark','马克','极简小人',''],['Wanko','汪子','碗里的小狗','']].map(a=>({name:a[1]+' '+a[0],desc:a[2],repo:OFF.split('/Samples')[0],path:'Samples/Resources/'+a[0]+'/'+a[0]+'.model3.json',off:1}));
let OL_CUR=[];
const BAD=/r18|r-18|nsfw|adult|hentai|18x|18禁|porn|sex|naked|nude|ero|涩|色情|成人|裸/i;
async function cdnFetch(repo,path,as){let e;for(const c of CDNS){try{const r=await fetch(c+repo+'/'+path.split('/').map(encodeURIComponent).join('/'));if(r.ok)return as==='json'?await r.json():await r.blob();e=new Error('HTTP '+r.status)}catch(x){e=x}}throw e||new Error('下载失败')}
function olRender(a,msg){OL_CUR=a;const el=$('#ol');if(!el)return;el.innerHTML=(msg?'<div class="tip">'+msg+'</div>':'')+a.map((o,i)=>`<div class="mi"><div class="n">${o.off?'⭐':'🌐'} ${o.name.replace(/</g,'&lt;')}<div style="font-size:12px;color:#8a92a3">${(o.desc||'').replace(/</g,'&lt;')}</div></div><span class="x" style="color:#3b7cff" onclick="olTry(${i})">试看</span><span class="x" style="color:#22a35a" onclick="olGet(${i})">下载</span></div>`).join('')}
async function olSearch(){const q=($('#oq').value||'').trim();const loc=OL_OFF.filter(o=>!q||(o.name+o.desc).toLowerCase().includes(q.toLowerCase()));
 olRender(loc,'正在联网搜索…');if(!q){olRender(OL_OFF);return}
 try{const r=await fetch('https://api.github.com/search/repositories?per_page=8&q='+encodeURIComponent(q+' live2d model3 in:name,description,readme'));const d=await r.json();
  if(!d.items){olRender(loc,d.message&&/rate/i.test(d.message)?'搜得太快了，等一分钟再搜':'没搜到');return}
  const out=[...loc];
  await Promise.all(d.items.filter(x=>!BAD.test(x.full_name+' '+(x.description||''))&&!x.private).slice(0,6).map(async x=>{try{
   const j=await (await fetch('https://data.jsdelivr.com/v1/packages/gh/'+x.full_name+'@'+x.default_branch+'?structure=flat')).json();
   (j.files||[]).map(f=>f.name).filter(p=>/\.model3\.json$/i.test(p)&&!BAD.test(p)).slice(0,12).forEach(p=>{p=p.replace(/^\//,'');
    out.push({name:p.split('/').pop().replace(/\.model3\.json$/i,''),desc:x.full_name+(x.stargazers_count?' · ★'+x.stargazers_count:''),repo:x.full_name+'@'+x.default_branch,path:p})})}catch(_){}}));
  olRender(out,out.length?'找到 '+out.length+' 个，可以直接用的都在这里':'没找到能直接用的模型，换个词试试')}catch(e){olRender(loc,'联网搜索失败，先看看官方模型')}}
function olUrl(o){return CDNS[0]+o.repo+'/'+o.path.split('/').map(encodeURIComponent).join('/')}
async function olTry(i){const o=OL_CUR[i];const id='u'+Date.now();await putModel({id,name:o.name+'（在线）',url:olUrl(o),added:Date.now(),kind:'url'});S.cur=id;save();renderLib();launch()}
async function olGet(i){const o=OL_CUR[i];toast('正在下载 '+o.name+'…',60000);try{
 const dir=o.path.replace(/[^/]*$/,''),mj=await cdnFetch(o.repo,o.path,'json'),R=mj.FileReferences||{},fs=new Set();
 [R.Moc,R.Physics,R.Pose,R.DisplayInfo,R.UserData,...(R.Textures||[]),...(R.Expressions||[]).map(e=>e.File)].forEach(f=>f&&fs.add(f));
 Object.values(R.Motions||{}).forEach(a=>a.forEach(m=>{m.File&&fs.add(m.File);m.Sound&&fs.add(m.Sound)}));
 const z=new JSZip(),mn=o.path.split('/').pop();z.file(mn,JSON.stringify(mj));let n=0;
 for(const f of fs){try{z.file(f,await cdnFetch(o.repo,dir+f));n++;toast('下载中 '+n+'/'+fs.size,60000)}catch(e){if(f===R.Moc||(R.Textures||[]).includes(f))throw new Error('缺少文件 '+f)}}
 const blob=await z.generateAsync({type:'blob'}),id='m'+Date.now();
 await putModel({id,name:o.name,file:'model.zip',size:blob.size,blob,added:Date.now(),kind:'zip'});S.cur=id;save();toast('下载好了：'+o.name);renderLib();launch()}catch(e){toast('下载失败：'+(e.message||e),4000)}}
async function addUrl(){const u=$('#url').value.trim();if(!/^https?:\/\/.+\.json(\?.*)?$/i.test(u)){toast('请填 model3.json 的网址');return}
 const id='u'+Date.now(),name=decodeURIComponent(u.split('/').pop().split('?')[0].replace(/\.model3?\.json$/i,''));
 await putModel({id,name:name+'（在线）',url:u,added:Date.now(),kind:'url'});S.cur=id;save();renderLib();launch()}
async function launch(){if(!S.cur){openP('lib');toast('先导入一个模型吧');return}
 const o=await getModel(S.cur);if(!o){S.cur=null;save();openP('lib');return}
 if(o.kind==='url'){if(!navigator.onLine)toast('现在没网，在线模型可能打不开',3000);show(o.url,o)}
 else{const f=new File([o.blob],o.file||'model.zip',{type:'application/zip'});show([f],o)}}
async function renderLib(){const a=await listModels();$('#cnt').textContent=a.length?('本地 '+a.length+' 个模型'):'点此导入模型';
 if(!$('#panel').classList.contains('on')||$('#panel').dataset.p!=='lib')return;
 $('#ml').innerHTML=a.length?a.map(o=>`<div class="mi ${o.id===S.cur?'cur':''}"><div class="n" onclick="S.cur='${o.id}';save();launch();renderLib()">${o.kind==='url'?'🌐':'📦'} ${o.name.replace(/</g,'&lt;')}</div><span style="font-size:12px;color:#8a92a3">${o.size?(o.size/1048576).toFixed(1)+'M':''}</span><span class="x" onclick="rm('${o.id}')">删除</span></div>`).join(''):'<div class="tip">还没有模型。</div>'}
async function rm(id){if(!confirm('删除这个模型？'))return;await delModel(id);if(S.cur===id){S.cur=null;save();if(m){app.stage.removeChild(m);m.destroy();m=null;core=null}$('#empty').style.display='';$('#curName').textContent='未选择模型';$('#goT').textContent='启动'}renderLib()}
// ---------- 背景 ----------
$('#fb').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;await tx('kv','readwrite',s=>s.put(f,'bg'));applyBg();toast('背景已更换')};
async function applyBg(){const b=await tx('kv','readonly',s=>s.get('bg'));$('#bg').style.backgroundImage=b?`url(${URL.createObjectURL(b)})`:'url(bg.jpg)'}
async function resetBg(){await tx('kv','readwrite',s=>s.delete('bg'));applyBg()}
function dim(){$('#bg').style.filter=`brightness(${1-S.dim})`}
// ---------- 面板 ----------
function openP(p){const P=$('#panel');document.querySelectorAll('#side .b').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 if(p==='home'){P.classList.remove('on');$('#side .b[data-p=home]').classList.add('on');return}
 if(p==='like'){likeAuthor();$('#side .b[data-p=like]').classList.remove('on');$('#side .b[data-p=home]').classList.add('on');return}
  if(p==='back'){if(window.Yu&&Yu.exit)Yu.exit();$('#side .b[data-p=home]').classList.add('on');return}
 P.dataset.p=p;
 if(p==='act'){if(!m){P.innerHTML='<h3>表情与动作</h3><div class="tip">先启动一个模型。</div>'}else{const e=exps(),defs=m.internalModel.motionManager.definitions||{};
  P.innerHTML='<h3>表情</h3>'+(e.length?'<div class="btns">'+e.map((n,i)=>`<div onclick="m.expression(${i})">${n}</div>`).join('')+'<div onclick="try{m.internalModel.motionManager.expressionManager.resetExpression()}catch(_){}">恢复默认</div></div>':'<div class="tip">这个模型没有表情文件。</div>')+
  '<h3 style="margin-top:16px">动作</h3>'+(Object.keys(defs).length?'<div class="btns">'+Object.entries(defs).flatMap(([g,arr])=>arr.map((d,i)=>`<div onclick="m.motion('${g}',${i},3)">${g}${arr.length>1?' '+(i+1):''}</div>`)).join('')+'</div>':'<div class="tip">这个模型没有动作文件。</div>')}}
 if(p==='lib'){P.innerHTML=`<h3>模型库</h3><div class="btn pri" onclick="$('#fz').click()">📦 从手机导入模型（.zip）</div>
  <div class="tip">压缩包里要有 .model3.json、.moc3 和贴图。导入后会存在 App 里，没网也能打开。</div>
  <h3 style="margin-top:16px">在线模型库（要联网）</h3><div class="tip">点「下载」存进本地，以后没网也能用；点「试看」直接在线打开。</div>
  <div style="display:flex;gap:8px"><input type="text" id="oq" placeholder="搜模型，比如 猫、女孩、Haru" style="flex:1" onkeydown="if(event.key==='Enter')olSearch()"><div class="btn" style="width:auto;padding:0 18px;margin:0" onclick="olSearch()">🔍 搜索</div></div>
  <div id="ol"></div>
  <details style="margin-top:10px"><summary class="tip" style="cursor:pointer">有网址？手动加载</summary><input type="text" id="url" placeholder="https://…/xxx.model3.json"><div class="btn" onclick="addUrl()">🌐 加载网址</div></details>
  <h3 style="margin-top:16px">本地模型</h3><div id="ml"></div>`;renderLib();olRender(OL_OFF)}
 if(p==='set')P.innerHTML=`<h3>设置</h3><div class="row">模型大小<input type="range" min="0.4" max="2" step="0.05" value="${S.scale}" oninput="S.scale=+this.value;save();fit()"></div>
  <div class="row">背景变暗<input type="range" min="0" max="0.7" step="0.05" value="${S.dim}" oninput="S.dim=+this.value;save();dim()"></div>
  <div class="row">视线跟着手指<div class="sw ${S.follow?'on':''}" onclick="S.follow=!S.follow;save();this.classList.toggle('on')"></div></div>
  <div class="row">自动轻微摇摆<div class="sw ${S.auto?'on':''}" onclick="S.auto=!S.auto;save();this.classList.toggle('on')"></div></div>
  <div class="btns" style="margin-top:8px"><div onclick="$('#fb').click()">🖼️ 换背景图</div><div onclick="resetBg()">恢复默认背景</div></div>
  <div class="tip" style="margin-top:14px">Live2D 播放器 1.0 · 支持 Cubism 4 / 5 模型 · 渲染库内置，离线可用</div>`;
 P.classList.add('on')}
document.querySelectorAll('#side .b').forEach(b=>b.onclick=()=>{const P=$('#panel');if(P.classList.contains('on')&&b.classList.contains('on'))openP('home');else openP(b.dataset.p)});
dim();applyBg();renderLib();if(S.cur)launch();
</script></body></html>
